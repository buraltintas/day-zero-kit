name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v5.1.0, pinned by commit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Manifests, skills, references, links and names
        run: python3 scripts/check_repo.py
