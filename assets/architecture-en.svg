<svg viewBox="-12 -12 744 470" xmlns="http://www.w3.org/2000/svg" width="1080" height="669" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: visitors reach the Next.js web through Cloudflare, the web calls the Go API as a BFF, the mobile app calls the Go API directly; the API uses Neon Postgres over a pooled connection; the change marker is in GCS, e-mail goes through Resend; Cloud Scheduler triggers Cloud Run Jobs, and the daily dump goes to the backup bucket, checked by a restore."><rect x="-12" y="-12" width="744" height="470" fill="#FFFFFF"/><defs>
