<text x="700" y="832" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">3 builds</text>
<text x="700" y="862" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Kept for bug fixes at month end</text>
<text x="80" y="930" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">44</text>
<text x="80" y="960" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Fake records a test wrote to production</text>
