<text x="700" y="538" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">6,654</text>
<text x="700" y="568" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Requests the bot door refused on day one</text>
<rect x="60" y="588" width="1160" height="98" fill="#F3F6F8"/>
<text x="80" y="636" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">30 days</text>
<text x="80" y="666" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">A depleted API credit told nobody</text>
<path d="M618 637.0 L654 637.0 M644 628.0 L655 637.0 L644 646.0" stroke="#8A94A3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="636" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">4 min</text>
<text x="700" y="666" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">From error to alarm once alerting was set</text>
<text x="80" y="734" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">21+ days</text>
<text x="80" y="764" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">A payment webhook failed silently</text>
<path d="M618 735.0 L654 735.0 M644 726.0 L655 735.0 L644 744.0" stroke="#8A94A3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="734" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">Day 0</text>
<text x="700" y="764" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Every dependency gets an owner and a channel</text>
<rect x="60" y="784" width="1160" height="98" fill="#F3F6F8"/>
<text x="80" y="832" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">1 week</text>
<text x="80" y="862" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Out of builds; a fix waited for the month</text>
