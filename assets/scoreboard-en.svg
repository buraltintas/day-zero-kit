<text x="700" y="930" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">0</text>
<text x="700" y="960" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">The test setup cannot touch production</text>
<text x="60" y="1032" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0E1A2B">The story, cost, fix and rule of each one is in the guide's case book (Vaka defteri).</text>
