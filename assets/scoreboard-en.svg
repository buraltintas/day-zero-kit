<text x="700" y="274" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">The same products after the fixes</text>
<text x="80" y="342" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">6.5 CU-hours</text>
<text x="80" y="372" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">A day; the database never slept</text>
<path d="M618 343.0 L654 343.0 M644 334.0 L655 343.0 L644 352.0" stroke="#8A94A3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="342" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">~2.1 CU-hours</text>
<text x="700" y="372" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Reads from memory, the database sleeps</text>
<rect x="60" y="392" width="1160" height="98" fill="#F3F6F8"/>
<text x="80" y="440" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">₺1,500/mo</text>
<text x="80" y="470" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">A maps API switched on with no cap</text>
<path d="M618 441.0 L654 441.0 M644 432.0 L655 441.0 L644 450.0" stroke="#8A94A3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="440" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B6B66" letter-spacing="-0.5">₺0</text>
<text x="700" y="470" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Open data and our own table</text>
<text x="80" y="538" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">41%</text>
<text x="80" y="568" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Of web requests went to one scraper</text>
