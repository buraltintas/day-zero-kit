<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1072" width="1280" height="1072" role="img" aria-label="Knocks taken, goals scored: ~₺4,400/mo Our cloud bill in September, then ~₺1,300/mo The same products after the fixes; 6.5 CU-hours A day; the database never slept, then ~2.1 CU-hours Reads from memory, the database sleeps; ₺1,500/mo A maps API switched on with no cap, then ₺0 Open data and our own table; 41% Of web requests went to one scraper, then 6,654 Requests the bot door refused on day one; 30 days A depleted API credit told nobody, then 4 min From error to alarm once alerting was set; 21+ days A payment webhook failed silently, then Day 0 Every dependency gets an owner and a channel; 1 week Out of builds; a fix waited for the month, then 3 builds Kept for bug fixes at month end; 44 Fake records a test wrote to production, then 0 The test setup cannot touch production">
<rect width="1280" height="1072" fill="#FFFFFF"/>
<rect width="1280" height="10" fill="#0B6B66"/>
<text x="60" y="82" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0E1A2B" letter-spacing="-0.8">Knocks taken, goals scored</text>
<text x="60" y="120" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#3A4658">August to October 2026, from our live products' bills and logs.</text>
<rect x="60" y="148" width="540" height="34" fill="#B42318"/>
<text x="80" y="172" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">The knock we took</text>
<rect x="680" y="148" width="540" height="34" fill="#0B6B66"/>
<text x="700" y="172" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">The goal we scored</text>
<rect x="60" y="196" width="1160" height="98" fill="#F3F6F8"/>
<text x="80" y="244" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#B42318" letter-spacing="-0.5">~₺4,400/mo</text>
<text x="80" y="274" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#3A4658">Our cloud bill in September</text>
